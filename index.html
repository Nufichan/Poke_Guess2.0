<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Pokémon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  img{
  -webkit-user-drag: none;
  user-select: none;
  -webkit-touch-callout: none; /* blocks iOS long-press menu */
  }
:root{
  --accent:#ffcb05;
  --accent2:#3b4cca;
  --bg1:#ff4e50; --bg2:#fc913a; --bg3:#667eea; --bg4:#764ba2;
  --glass: rgba(255,255,255,0.14);
  --glass-strong: rgba(255,255,255,0.28);
  --ink:#fff;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito', system-ui, sans-serif;
  color:var(--ink);
  min-height:100vh; min-height:100dvh;
  overflow-x:hidden;
  background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
  background-size:400% 400%;
  animation: gradientBG 14s ease infinite;
  position:relative;
  transition: background 0.6s ease;
}
@keyframes gradientBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
h1,h2,h3{font-family:'Baloo 2', 'Nunito', sans-serif; margin:0;}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, .card:focus-visible{
  outline: 3px solid #fff; outline-offset:2px;
}

/* floating pokeballs layer */
#pokeballs{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
.pokeball{
  position:absolute; width:56px; opacity:0.13; top:110%;
  animation-name: floatUp; animation-timing-function:linear; animation-iteration-count:infinite;
  filter:drop-shadow(0 0 6px rgba(0,0,0,0.2));
}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);}100%{transform:translateY(-140vh) rotate(360deg);}}

#app{position:relative; z-index:1; min-height:100dvh; display:flex; flex-direction:column; align-items:center;}
.view{width:100%; max-width:820px; padding:28px 18px 60px; margin:0 auto; animation:viewIn 0.45s ease both;}
@keyframes viewIn{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}
.view.leaving{animation:viewOut 0.25s ease both;}
@keyframes viewOut{to{opacity:0; transform:translateY(-10px);}}

/* ---------- HOME ---------- */
.home-hero{text-align:center; margin-bottom:6px;}
.home-hero img{width:230px; max-width:70vw; filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35));}
.home-title{font-size:clamp(28px,6vw,44px); font-weight:800; text-shadow:0 4px 12px rgba(0,0,0,0.4); margin:6px 0 4px;}
.home-sub{opacity:0.92; font-weight:600; margin-bottom:28px; font-size:15px;}

.cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;}
.cat-card{
  position:relative; display:flex; align-items:center; gap:14px; text-align:left;
  padding:16px 18px; border-radius:var(--radius); text-decoration:none; color:var(--ink);
  background:var(--glass); border:1px solid rgba(255,255,255,0.32); backdrop-filter:blur(12px);
  cursor:pointer; overflow:hidden; transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
  border-top:4px solid var(--cat-accent, #fff);
}
.cat-card:hover, .cat-card:focus-visible{transform:translateY(-5px) scale(1.02); background:var(--glass-strong); box-shadow:0 14px 26px rgba(0,0,0,0.28);}
.cat-card img{width:52px; height:52px; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
.cat-card .cat-info{flex:1; min-width:0;}
.cat-card .cat-name{font-weight:800; font-size:17px; line-height:1.15;}
.cat-card .cat-meta{font-size:12.5px; opacity:0.85; margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.cat-card .cat-count{background:rgba(0,0,0,0.22); padding:2px 8px; border-radius:20px; font-weight:700;}

.home-socials{
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
  margin:30px auto 0;
}
.home-socials a{
  display:flex; align-items:center; justify-content:center; width:48px; height:48px;
  border-radius:50%; text-decoration:none;
  background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); backdrop-filter:blur(10px);
  transition:.3s ease;
}
.home-socials a:hover{transform:translateY(-4px) scale(1.08); background:rgba(255,255,255,0.3);}
.home-socials img{width:22px; height:22px;}

/* ---------- BOARD ---------- */
.board-top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin-bottom:18px;}
.back-btn{
  display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3);
  color:#fff; font-weight:700; text-decoration:none; padding:9px 14px; border-radius:12px; cursor:pointer;
  font-size:14px; backdrop-filter:blur(8px); transition:.2s ease;
  justify-self:start;
}
.back-btn:hover{background:rgba(255,255,255,0.32); transform:translateY(-2px);}
.board-title{ grid-column:2; text-align:center; font-size:clamp(22px,5vw,30px); font-weight:800; text-shadow:0 3px 10px rgba(0,0,0,0.35); }
.board-layout{display:flex; flex-direction:column; align-items:center; gap:16px;}

.secret{
  background:rgba(255,255,255,0.95); color:#222; border-radius:22px; padding:18px;
  box-shadow:0 14px 30px rgba(0,0,0,0.3); text-align:center; width:100%; max-width:280px;
  cursor:pointer; position:relative; min-height:200px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; transition:transform .4s ease, opacity .4s ease;
}
.secret img{width:150px; height:150px; object-fit:contain;}
.secret.hidden img,.secret.hidden h2{display:none;}
.secret.hidden::after{
  content:"Tap to peek 👀"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#2b2f77,#111); color:#fff; border-radius:22px; font-size:16px; font-weight:800; letter-spacing:.5px; text-align:center; padding:0 16px;
}
.secret.showing{animation:revealEffect .55s ease forwards;}
.secret.hiding{animation:hideEffect .5s ease forwards;}
@keyframes revealEffect{0%{transform:scale(.8) rotateY(90deg); opacity:0;}100%{transform:scale(1) rotateY(0deg); opacity:1;}}
@keyframes hideEffect{0%{transform:scale(1) rotateY(0deg); opacity:1;}100%{transform:scale(.8) rotateY(90deg); opacity:0;}}
.secret.showing img{animation:popOut .55s ease forwards;}
@keyframes popOut{0%{transform:scale(.3); opacity:0;}55%{transform:scale(1.18); opacity:1;}100%{transform:scale(1); opacity:1;}}
.secret h2{margin-top:8px; font-size:20px; font-weight:800;}

.pokeball-reveal{position:absolute; width:110px; z-index:10; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); animation:ballOpen .75s ease forwards; pointer-events:none;}
@keyframes ballOpen{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0;}40%{transform:translate(-50%,-50%) scale(1.2) rotate(180deg);opacity:1;}70%{transform:translate(-50%,-50%) scale(1) rotate(360deg);}100%{transform:translate(-50%,-50%) scale(0);opacity:0;}}
.flash{position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%); top:50%; left:50%; transform:translate(-50%,-50%) scale(0); z-index:9; animation:flashAnim .6s ease forwards; pointer-events:none;}
@keyframes flashAnim{0%{transform:translate(-50%,-50%) scale(0);opacity:1;}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1;}100%{transform:translate(-50%,-50%) scale(2);opacity:0;}}

.controls-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.btn{
  padding:11px 20px; font-size:14px; font-weight:800; border:none; border-radius:14px; cursor:pointer;
  background:var(--accent); color:#20241f; box-shadow:0 6px 14px rgba(0,0,0,0.25); transition:.2s ease;
}
.btn:hover{transform:translateY(-3px) scale(1.03);}
.btn.secondary{background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.35);}
.btn:active{transform:scale(.96);}

.grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:100%; margin-top:6px;}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(5, 1fr);}
}
.card{
  background:rgba(255,255,255,0.94); color:#222; border-radius:14px; padding:8px 6px; text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.2); cursor:pointer; position:relative; transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}
.card img{width:64px; height:64px; object-fit:contain;}
.card .cname{font-size:11px; font-weight:700; margin-top:2px; line-height:1.2; word-break:break-word;}
.card:hover{transform:translateY(-5px) scale(1.05); box-shadow:0 0 14px rgba(255,255,255,0.6), 0 0 22px var(--cat-accent,#ffcb05);}
.card.removed{opacity:0.32;}
.card.removed::after{content:"✖"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:30px; color:#e63946; font-weight:900;}


footer.credit{margin-top:34px; font-size:12px; opacity:0.75; text-align:center; font-weight:600;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001s !important; animation-iteration-count:1 !important; transition-duration:0.001s !important;}
}

/* ===== Floating music player (Safari Ball launcher) ===== */
.music-launcher{
  position:fixed;
  right:max(20px, env(safe-area-inset-right));
  top:50%;
  margin-top:-29px; /* half of height, keeps it vertically centered on the right edge so it never runs off-screen */
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:transparent;
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:1000;
  box-shadow:none;
  transition:.25s ease;
  padding:0;
}
.music-launcher:hover{transform:scale(1.1)}
.music-launcher.active{transform:rotate(25deg) scale(1.05)}
.music-launcher-icon{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));
}
.music-options{
  position:fixed;
  right:max(20px, env(safe-area-inset-right));
  top:50%;
  margin-top:-29px;
  width:58px;
  height:58px;
  z-index:999;
  pointer-events:none;
}
.music-option{
  position:absolute;
  right:0;
  bottom:0;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  cursor:pointer;
  opacity:0;
  transform:translate(0,0) scale(.4);
  transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1),background .2s ease;
  pointer-events:none;
  box-shadow:0 5px 16px rgba(0,0,0,.2);
}
.music-options.open{pointer-events:auto}
.music-options.open .music-option{
  opacity:.88;
  pointer-events:auto;
}
.music-options.open .music-option:nth-child(1){transform:translateY(-78px) scale(1)}
.music-options.open .music-option:nth-child(2){transform:translate(-62px,-48px) scale(1)}
.music-options.open .music-option:nth-child(3){transform:translate(-76px,0) scale(1)}
.music-options.open .music-option:nth-child(4){transform:translate(-62px,48px) scale(1)}
.music-options.open .music-option:nth-child(5){transform:translateY(78px) scale(1)}
.music-option:hover,.music-option.active{
  opacity:1;
  background:rgba(255,255,255,.2);
}
.music-icon{font-size:22px;line-height:1}
.music-icon-img{width:26px;height:26px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));display:block;margin:0 auto}
.music-label{font-size:9px;font-weight:700;margin-top:2px;display:block}
.music-tooltip{
  position:fixed;
  right:88px;
  bottom:28px;
  z-index:998;
  padding:7px 10px;
  border-radius:10px;
  color:#fff;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  font-size:12px;
  opacity:0;
  transform:translateX(8px);
  transition:.2s;
  pointer-events:none;
  white-space:nowrap;
}
.music-tooltip.show{opacity:1;transform:translateX(0)}
@media (max-width: 480px) {
  .music-launcher, .music-options{
    right: max(10px, env(safe-area-inset-right));
    margin-top: -25px;
    width: 50px;
    height: 50px;
  }
  .music-option{
    width: 44px;
    height: 44px;
  }
}
</style>
</head>
<body>
<!-- ===== Floating music player ===== -->
<button class="music-launcher" id="launcher" aria-label="Open music controls">
  <img class="music-launcher-icon" id="launcherIcon" src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/Meloetta.png" alt="Music menu">
</button>
<div class="music-options" id="options" aria-label="Music controls">
  <button class="music-option" data-volume="0.10" title="Zygarde 10% volume">
    <img class="music-icon-img" src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/10.png" alt="Zygarde"><span class="music-label">10%</span>
  </button>
  <button class="music-option" data-volume="0.25" title="Zygarde 25% volume">
    <img class="music-icon-img" src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/25.png" alt="Zygarde"><span class="music-label">25%</span>
  </button>
  <button class="music-option active" data-volume="0.50" title="Zygarde 50% volume">
    <img class="music-icon-img" src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/50.png" alt="Zygarde"><span class="music-label">50%</span>
  </button>
  <button class="music-option" data-volume="1.00" title="Zygarde 100% volume">
    <img class="music-icon-img" src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/100.png" alt="Zygarde"><span class="music-label">100%</span>
  </button>
  <button class="music-option" data-volume="0.00" title="Zygarde 0% volume (mute)">

  </button>
</div>
<div class="music-tooltip" id="tooltip"></div>
<audio id="music" preload="auto" loop></audio>

<div id="pokeballs"></div>
<div id="app"></div>

<script>
(function(){
"use strict";
const POKEBALL_IMG = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png";

/* Base of the GitHub repo that hosts every photo. Change this one line if the repo moves. */
const REPO_RAW_BASE = "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/";

/* Builds a Photos/<folder>/<name>.png URL. A "/" in a category label (e.g. "Paradox/UB")
   becomes nested folders (Photos/Paradox/UB/...), matching the repo layout. */
function photoUrl(folder, name){
  const segs = folder.split("/").map(encodeURIComponent);
  return REPO_RAW_BASE + "Photos/" + segs.join("/") + "/" + encodeURIComponent(name) + ".png";
}
function slugify(label){
  return label.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

/* ==========================================================================
   ADD A NEW CATEGORY HERE — nothing else in this file needs to change.
   - label: shown on the category card and board title, and used to build
     its photo folder (Photos/<label>/...) unless you set "folder" below.
   - folder: optional — only needed when the GitHub photo folder's name
     doesn't match the label exactly (e.g. it uses "&" instead of "/").
   - type: "pokemon" or "character" — controls the "X Pokémon"/"X Characters" text.
   - accent: [primaryColor, secondaryColor] used for the category's background glow.
   - names: exact Pokémon/character names — each maps straight to
     Photos/<folder>/<name>.png in the repo, and the folder's Menu.png is
     used as the category's card icon.
   Music: a category automatically plays its dedicated track if roleTracks
   (bottom of the file) has an entry whose name matches this category's id
   (its slugified label, e.g. "za-mega" for "ZA Mega") — add one there when
   you add the matching audio file. No entry = falls back to the home shuffle.
   ========================================================================== */
const CATEGORY_DEFS = [
  { label:"Starter", type:"pokemon", accent:["#3ddc84","#3b4cca"], names:["Venusaur","Charizard","Blastoise","Meganium","Feraligatr","Typhlosion","Sceptile","Blaziken","Swampert","Torterra","Infernape","Empoleon","Serperior","Emboar","Samurott","Chesnaught","Delphox","Greninja","Decidueye","Incineroar","Primarina","Rillaboom","Cinderace","Inteleon","Meowscarada","Skeledirge","Quaquaval","Browt","Pombon","Gecqua"] },
  { label:"Legendary", type:"pokemon", accent:["#a78bfa","#fbbf24"], names:["Mewtwo","Ho-Oh","Lugia","Galar Articuno","Galar Zapdos","Galar Moltres","Primal Groudon","Primal Kyogre","Mega Rayquaza","Dialga","Palkia","Giratina","Zekrom","Reshiram","Kyurem","Xerneas","Yveltal","Zygarde","Solgaleo","Lunala","Ultra Necrozma","Crowned Zacian","Crowned Zamazenta","Eternamax Eternatus","Regigigas","Calyrex Shadow","Calyrex Ice","Koraidon","Miraidon","Ogerpon"] },
  { label:"Mythical", type:"pokemon", accent:["#f472b6","#818cf8"], names:["Mew","Celebi","Jirachi","Deoxys","Darkrai","Shaymin","Arceus","Victini","Keldeo","Meloetta","Genesect","Diancie","Hoopa Unbound","Volcanion","Magearna","Marshadow","Zeraora","Melmetal","Zarude","Terapagos","Pecharunt"] },
  { label:"Mega", type:"pokemon", accent:["#ff7849","#ffcb05"], names:["Mega Venusaur","Mega Charizard X","Mega Charizard Y","Mega Blastoise","Mega Alakazam","Mega Gengar","Mega Kangaskhan","Mega Pinsir","Mega Gyarados","Mega Ampharos","Mega Scizor","Mega Heracross","Mega Houndoom","Mega Tyranitar","Mega Sceptile","Mega Blaziken","Mega Swampert","Mega Gardevoir","Mega Sharpedo","Mega Camerupt","Mega Gallade","Mega Aggron","Mega Manectric","Mega Banette","Mega Absol","Mega Salamence","Mega Metagross","Mega Lopunny","Mega Garchomp","Mega Lucario"] },
  { label:"ZA Mega", type:"pokemon", accent:["#f59e0b","#ef4444"], names:["Mega Raichu X","Mega Raichu Y","Mega Clefairy","Mega Victreebel","Mega Starmie","Mega Dragonite","Mega Meganium","Mega Feraligatr","Mega Emboar","Mega Absol Z","Mega Staraptor","Mega Lucario Z","Mega Froslass","Mega Heatran","Mega Scolipede","Mega Scrafty","Mega Eelektross","Mega Chesnaught","Mega Delphox","Mega Greninja","Mega Floette","Mega Meowstic","Mega Malamar","Mega Barbaracle","Mega Dragalge","Mega Golisopod","Mega Drampa","Mega Falinks","Mega Scovillain","Mega Baxcalibur"] },
  { label:"Gigantamax", type:"pokemon", accent:["#c026d3","#6d28d9"], names:["G-Max Charizard","G-Max Venusaur","G-Max Blastoise","G-Max Butterfree","G-Max Eevee","G-Max Pikachu","G-Max Meowth","G-Max Machamp","G-Max Gengar","G-Max Lapras","G-Max Snorlax","G-Max Melmetal","G-Max Rillaboom","G-Max Cinderace","G-Max Inteleon","G-Max Corviknight","G-Max Orbeetle","G-Max Drednaw","G-Max Coalossal","G-Max Flapple & Appletun","G-Max Sandaconda","G-Max Toxtricity","G-Max Centiskorch","G-Max Hatterene","G-Max Grimmsnarl","G-Max Alcremie","G-Max Copperajah","G-Max Duralodon","G-Max Urshifu Rapid Strike","G-Max Urshifu Single Strike"] },
  { label:"Paradox/UB", folder:"Paradox&UB", type:"pokemon", accent:["#2dd4bf","#22d3ee"], names:["Nihilego","Buzzwole","Pheromosa","Xurkitree","Celesteela","Kartana","Guzzlord","Naganadel","Stakataka","Blacephalon","Great Tusk","Scream Tail","Brute Bonnet","Flutter Mane","Slither Wing","Sandy Shocks","Roaring Moon","Iron Treads","Iron Bundle","Iron Hands","Iron Jugulis","Iron Moth","Iron Thorns","Iron Valiant","Walking Wake","Iron Leaves","Gouging Fire","Raging Bolt","Iron Boulder","Iron Crown"] },
  { label:"Pseudo Dragon", type:"pokemon", accent:["#c98a4b","#4c7a72"], names:["Dragonite","Kingdra","Tyranitar","Flygon","Salamence","Metagross","Garchomp","Haxorus","Hydreigon","Tyrantrum","Noivern","Goodra","Hisuian Goodra","Turtonator","Kommo-o","Dracozolt","Dracovish","Dragapult","Baxcalibur","Hydrapple","Archaludon"] },
  { label:"Companion", type:"character", accent:["#ff9aa2","#4fc3f7"], names:["Ash","Misty","Brock","Gary","Jessie","James","Tracey","May","Max","Dawn","Paul","Iris","Cilan","N","Serena","Clemont","Bonnie","Lillie","Mallow","Lana","Kiawe","Sophocles","Alain","Gladion","Goh","Chloe","Leon","Liko","Roy","Friede"] },
  { label:"Champs/Villains", folder:"Champs&Villains", type:"character", accent:["#e63946","#1d1b3a"], names:["Giovanni","Archer","Lance","Maxie","Archie","Wallace","Steven","Cyrus","Cynthia","Volo","Ghetsis","Colress","Alder","Iris","Lysandre","Diantha","Lusamine","Guzma","Rose","Oleana","Leon","Sada","Turo","Nemona"] },
];

const CATEGORIES = CATEGORY_DEFS.map(def=>{
  const folder = def.folder || def.label;
  return {
    id: slugify(def.label),
    label: def.label,
    type: def.type,
    icon: photoUrl(folder, "Menu"),
    accent: {a:def.accent[0], b:def.accent[1]},
    items: def.names.map(n=>[n, photoUrl(folder, n)]),
  };
});
const ACCENTS = {};
CATEGORIES.forEach(c=>{ ACCENTS[c.id] = c.accent; });
const BG_SETS = {
  home:["#ff4e50","#fc913a","#667eea","#764ba2"],
};

const app = document.getElementById('app');

/* ---------- floating pokeballs ---------- */
function initPokeballs(){
  const layer = document.getElementById('pokeballs');
  layer.innerHTML="";
  const n = window.innerWidth < 600 ? 5 : 8;
  for(let i=0;i<n;i++){
    const img = document.createElement('img');
    img.src = POKEBALL_IMG;
    img.className = 'pokeball';
    img.alt = "";
    const left = Math.random()*94+2;
    const dur = 14 + Math.random()*14;
    const delay = -Math.random()*dur;
    const size = 40 + Math.random()*40;
    img.style.left = left+"%";
    img.style.width = size+"px";
    img.style.animationDuration = dur+"s";
    img.style.animationDelay = delay+"s";
    layer.appendChild(img);
  }
}

/* ---------- routing ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  if(!h) return {view:'home'};
  if(h.startsWith('cat/')) return {view:'board', id:h.slice(4)};
  return {view:'home'};
}

function navigate(hash){ location.hash = hash; }

function setBodyAccent(catId){
  document.body.dataset.musicRole = catId || "";
  if(window.PokeMusic) window.PokeMusic.setRole(document.body.dataset.musicRole);
  const root = document.documentElement.style;
  if(catId && ACCENTS[catId]){
    const c = ACCENTS[catId];
    document.body.style.setProperty('--bg1', c.a);
    document.body.style.setProperty('--bg2', c.b);
    document.body.style.setProperty('--bg3', '#20214f');
    document.body.style.setProperty('--bg4', '#0f0f28');
    document.body.style.setProperty('--accent', c.a);
  } else {
    document.body.style.setProperty('--bg1', '#ff4e50');
    document.body.style.setProperty('--bg2', '#fc913a');
    document.body.style.setProperty('--bg3', '#667eea');
    document.body.style.setProperty('--bg4', '#764ba2');
    document.body.style.setProperty('--accent', '#ffcb05');
  }
}

function render(){
  const route = parseHash();
  const old = app.querySelector('.view');
  const finish = ()=>{
    if(route.view === 'home') renderHome();
    else if(route.view === 'board') renderBoard(route.id);
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
  };
  if(old){
    old.classList.add('leaving');
    setTimeout(()=>{ app.innerHTML=''; finish(); }, 180);
  } else {
    finish();
  }
}

/* ---------- HOME ---------- */
function renderHome(){
  setBodyAccent(null);
  const view = document.createElement('div');
  view.className = 'view';
  const totalCats = CATEGORIES.length;

  view.innerHTML = `
    <div class="home-hero">
      <img src="https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Photos/SFX/PokemonLogo.svg" alt="Pokémon logo">
      <div class="home-title">Guess the Pokémon</div>
      <div class="home-sub">Pick a category, think of one, and see if your friends can guess it 🔴⚪</div>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="home-socials">
      <a href="https://www.facebook.com/AbooSamin" target="_blank" rel="noopener" aria-label="Facebook">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/aboo_samin" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
      </a>
      <a href="https://x.com/aboosamin" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitter.svg" alt="X">
      </a>
    </div>
    <footer class="credit">${totalCats} categories · ${CATEGORIES.reduce((s,c)=>s+c.items.length,0)} to guess</footer>
  `;
  app.appendChild(view);

  const grid = view.querySelector('#catGrid');
  CATEGORIES.forEach(cat=>{
    const accent = (ACCENTS[cat.id]||{}).a || '#ffcb05';
    const card = document.createElement('a');
    card.href = '#/cat/'+cat.id;
    card.className = 'cat-card';
    card.style.setProperty('--cat-accent', accent);
    card.innerHTML = `
      <img src="${cat.icon}" alt="">
      <div class="cat-info">
        <div class="cat-name">${cat.label}</div>
        <div class="cat-meta">
          <span class="cat-count">${cat.items.length} ${cat.type === 'character' ? 'Characters' : 'Pokémon'}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ---------- BOARD ---------- */
function renderBoard(catId){
  const cat = CATEGORIES.find(c=>c.id===catId);
  if(!cat){ navigate('#/'); return; }
  setBodyAccent(catId);
  const accent = (ACCENTS[catId]||{}).a || '#ffcb05';
  let secret = null; // [name,url]
  let revealed = false;

  const view = document.createElement('div');
  view.className = 'view';
  view.innerHTML = `
    <div class="board-top">
  <a class="back-btn" href="#/">← Categories</a>
  <div class="board-title">${cat.label}</div>
  <div></div>
</div>
    <div class="board-layout">
      <div class="secret hidden" id="secretBox" tabindex="0" role="button" aria-label="Reveal secret Pokémon">
        <img id="secretImg" src="" alt="Secret Pokémon" />
        <h2 id="secretName"></h2>
      </div>
      <div class="controls-row">
        <button class="btn" id="newRoundBtn">🔄 New Round</button>
        <button class="btn secondary" id="resetGridBtn">↺ Reset crossed-off</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  `;
  app.appendChild(view);
  view.style.setProperty('--cat-accent', accent);

  const grid = view.querySelector('#grid');
  const secretBox = view.querySelector('#secretBox');
  const secretImg = view.querySelector('#secretImg');
  const secretName = view.querySelector('#secretName');
  function buildGrid(){
    grid.innerHTML = '';
    cat.items.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.dataset.name = p[0].toLowerCase();
      card.innerHTML = `<img src="${p[1]}" alt="" loading="lazy"><div class="cname">${p[0]}</div>`;
      const toggle = ()=> card.classList.toggle('removed');
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }});
      grid.appendChild(card);
    });
  }

  function newRound(){
    const idx = Math.floor(Math.random()*cat.items.length);
    secret = cat.items[idx];
    secretImg.src = secret[1];
    secretName.textContent = secret[0];
    secretBox.classList.remove('showing');
    secretBox.classList.add('hidden');
    revealed = false;
    buildGrid();
  }

  function doReveal(){
    if(secretBox.classList.contains('hidden')){
      secretBox.classList.remove('hidden');
      const ball = document.createElement('img');
      ball.src = POKEBALL_IMG;
      ball.className = 'pokeball-reveal';
      document.body.appendChild(ball);
      const flash = document.createElement('div');
      flash.className = 'flash';
      document.body.appendChild(flash);
      setTimeout(()=>{ ball.remove(); flash.remove(); }, 800);
      secretBox.classList.remove('showing','hiding');
      void secretBox.offsetWidth;
      secretBox.classList.add('showing');
      revealed = true;
    } else {
      secretBox.classList.remove('showing');
      secretBox.classList.add('hiding');
      setTimeout(()=>{ secretBox.classList.add('hidden'); secretBox.classList.remove('hiding'); }, 480);
    }
  }

  secretBox.addEventListener('click', doReveal);
  secretBox.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); doReveal(); }});
  view.querySelector('#newRoundBtn').addEventListener('click', newRound);
  view.querySelector('#resetGridBtn').addEventListener('click', ()=>{
    grid.querySelectorAll('.card.removed').forEach(c=>c.classList.remove('removed'));
  });

  newRound();
}

window.addEventListener('hashchange', render);
window.addEventListener('resize', ()=>{ /* no-op, kept light */ });
document.addEventListener('contextmenu', e => {
  if(e.target.tagName === 'IMG') e.preventDefault();
});
initPokeballs();
render();
})();
</script>

<script>
const roleTracks = [
  {name: "starter", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Starter.m4a"},
  {name: "legendary", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Legendary.m4a"},
  {name: "mythical", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Mythical.m4a"},
  {name: "mega", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Mega.m4a"},
  {name: "za-mega", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/LegendsZA.m4a"},
  {name: "gigantamax", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Gigantamax.m4a"},
  {name: "paradox-ub", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Paradox.m4a"},
  {name: "pseudo-dragon", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/PseudoDragon.m4a"},
  {name: "champs-villains", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Villain.m4a"},
  {name: "companion", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Companion.m4a"}
];
// Home-screen randomizer pool (region themes) - NOT the per-menu role tracks above
const homeTracks = [
  {name: "Home 1", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/1.m4a"},
  {name: "Home 2", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/2.m4a"},
  {name: "Home 3", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/3.m4a"},
  {name: "Home 4", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/4.m4a"},
  {name: "Home 5", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/5.m4a"},
  {name: "Home 6", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/6.m4a"},
  {name: "Home 7", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/7.m4a"},
  {name: "Home 8", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/8.m4a"},
  {name: "Home 9", src: "https://raw.githubusercontent.com/Nufichan/Poke_Guess2.0/main/Audio/Home/9.m4a"}
];
const music=document.getElementById("music");
const launcher=document.getElementById("launcher");
const options=document.getElementById("options");
const volumeButtons=document.querySelectorAll(".music-option[data-volume]");
const tooltip=document.getElementById("tooltip");

let current=-1;
let open=false;
let wasPlayingBeforeHidden=false; // tracks whether to auto-resume when the tab/window becomes visible again
music.volume=.5;


function getMusicRole() {
  return (
    document.body?.dataset?.musicRole ||
    document.documentElement?.dataset?.musicRole ||
    document.querySelector("[data-music-role]")?.dataset?.musicRole ||
    ""
  ).trim().toLowerCase();
}

function chooseRandom(){
  let n;
  do{n=Math.floor(Math.random()*homeTracks.length)}while(homeTracks.length>1&&n===current);
  current=n;
  music.src=homeTracks[n].src;
  music.load();
}

function findTrackByRole(role){
  if(!role)return -1;
  return roleTracks.findIndex(t=>t.name===role);
}

function playRoleTrack(idx){
  current=idx;
  music.loop=true; // this menu's track repeats forever, no switching
  music.src=roleTracks[idx].src;
  music.load();
}

function playRandomizer(){
  music.loop=false; // home screen: keep picking a new random track forever
  chooseRandom();
}

function applyMusicForRole(role){
  const idx=findTrackByRole(role);
  if(idx!==-1)playRoleTrack(idx);
  else playRandomizer();
  setTimeout(startMusic,1000); // new track loaded - wait 3s before it starts (not a replay/resume)
}

// Exposed so a single-page app can switch tracks on navigation without a
// full page reload, e.g. window.PokeMusic.setRole('starter') on entering
// the Starter page, and window.PokeMusic.setRole('') on returning home.
window.PokeMusic={
  setRole:function(role){
    applyMusicForRole((role||"").trim().toLowerCase());
  }
};

function tip(message){
  tooltip.textContent=message;
  tooltip.classList.add("show");
  clearTimeout(window.tipTimer);
  window.tipTimer=setTimeout(()=>tooltip.classList.remove("show"),1400);
}

async function startMusic(){
  try{
    await music.play();
  }catch(e){
    tip("Tap the music button to start");
  }
}

function toggleMenu(){
  open=!open;
  options.classList.toggle("open",open);
  launcher.classList.toggle("active",open);
}

launcher.addEventListener("click",toggleMenu);

volumeButtons.forEach(btn=>{
  btn.addEventListener("click",async()=>{
    music.volume=Number(btn.dataset.volume);
    volumeButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    if(music.volume===0){
      tip("Music muted");
    }else{
      await startMusic();
      tip("Volume: "+Math.round(music.volume*100)+"%");
    }
  });
});

// Auto-stop the music when the tab/window is hidden or minimized (instead of
// playing on unfocused in the background), and pick back up where it left
// off once the page is visible again.
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    wasPlayingBeforeHidden=!music.paused;
    if(!music.paused)music.pause();
  }else if(wasPlayingBeforeHidden){
    wasPlayingBeforeHidden=false;
    startMusic();
  }
});

music.addEventListener("ended",()=>{
  // Only reached on the home-screen randomizer (music.loop is true on
  // every role-specific menu, so this never fires there). A new track is
  // being loaded, so wait 3s before it starts, same as any other fresh start.
  chooseRandom();
  setTimeout(startMusic,1000);
});

applyMusicForRole(getMusicRole());
</script>
</body>
